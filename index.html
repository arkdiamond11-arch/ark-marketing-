<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b1e3c">
  <title>Marketing — Lead Capture</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="splash">
      <div class="logo-badge" id="splash-badge">&nbsp;</div>
      <p id="splash-name">Loading…</p>
    </div>
  </div>
  <div id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    /* Puts your business name (from config.js) on the tab and splash screen,
       and explains clearly if setup is not finished yet. */
    (function () {
      var c = window.APP_CONFIG || {};
      var name = c.BUSINESS_NAME || 'Marketing';
      document.title = name + ' — Marketing';
      var b = document.getElementById('splash-badge');
      if (b) b.textContent = c.BUSINESS_SHORT || '';
      var n = document.getElementById('splash-name');
      if (n) n.textContent = name + ' · Marketing';

      function stop(title, detail) {
        document.getElementById('app').innerHTML =
          '<div class="splash" style="text-align:center;padding:28px">' +
          '<h2 style="margin:0 0 10px;font-size:18px">' + title + '</h2>' +
          '<p style="margin:0;font-size:14px;line-height:1.5;opacity:.85">' + detail + '</p></div>';
      }

      var url = c.SUPABASE_URL || '', key = c.SUPABASE_KEY || '';
      if (!url || !key || url.indexOf('PASTE_') === 0 || key.indexOf('PASTE_') === 0) {
        stop('Setup is not finished',
             'Open <b>config.js</b> and fill in your Supabase project URL and anon public key, ' +
             'then upload it again. See SETUP-GUIDE.md, step 3.');
        return;
      }
      if (!window.supabase || !window.supabase.createClient) {
        stop('Could not load a required file',
             'The app could not reach the internet to load one of its libraries. ' +
             'Check the connection and refresh the page.');
        return;
      }
      // Add-on screens first (in this order), then the main app.
      // async=false keeps the order while the files download in parallel;
      // if one add-on fails to load, the rest of the app still works.
      window.ACTIONS = window.ACTIONS || {};          // data-action name → handler
      window.SEG_HOOKS = window.SEG_HOOKS || [];      // called after a choice button is tapped
      window.INPUT_HOOKS = window.INPUT_HOOKS || [];  // called on every typed input
      window.LOGIN_HOOKS = window.LOGIN_HOOKS || [];  // called once after sign-in
      var v = '6';
      window.APP_V = v;
      ['i18n.js', 'jewel.js', 'orders.js', 'util.js', 'docs.js', 'ledger.js', 'steps.js',
       'accounts.js', 'reports.js', 'catalogue.js', 'karigars.js', 'visits.js', 'targets.js', 'summary.js',
       'app.js'].forEach(function (f) {
        var s = document.createElement('script');
        s.src = f + '?v=' + v;
        s.async = false;
        document.body.appendChild(s);
      });
    })();
  </script>
</body>
</html>
