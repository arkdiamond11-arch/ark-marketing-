<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b1e3c">
  <meta name="robots" content="noindex">
  <title>Send us your design</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    :root { --maroon: #7b1e3c; --gold: #c9973c; --bg: #f6f4f1; --card: #fff; --ink: #27222b; --muted: #857e8c; --line: #eae6e2; --green: #1a7f4e; --red: #b3372f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", "Noto Sans Gujarati", sans-serif; font-size: 15px; line-height: 1.45; }
    header { background: var(--maroon); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 14px; }
    header .biz { font-size: 13px; letter-spacing: .6px; text-transform: uppercase; opacity: .85; }
    header h1 { margin: 2px 0 0; font-size: 21px; }
    header .shop { font-size: 14px; opacity: .9; }
    main { max-width: 560px; margin: 0 auto; padding: 14px 16px 30px; }
    .langs { display: flex; gap: 6px; justify-content: flex-end; margin: 0 0 10px; }
    .langs button { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
    .langs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .card { background: var(--card); border-radius: 14px; box-shadow: 0 1px 3px rgba(40,20,30,.08), 0 4px 14px rgba(40,20,30,.05); padding: 13px 14px; margin: 0 0 12px; }
    .lead { color: var(--muted); margin: 0 0 12px; }
    h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin: 16px 2px 8px; }
    .pics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pic { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #f3efe9; }
    .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pic button { position: absolute; right: 4px; top: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(20, 15, 20, .65); color: #fff; font-size: 13px; cursor: pointer; }
    .add { aspect-ratio: 1; border-radius: 12px; border: 2px dashed #d9cfc6; background: #fbf8f5; color: var(--maroon); font: inherit; font-weight: 750; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .add b { font-size: 26px; line-height: 1; }
    .add span { font-size: 12.5px; }
    label { display: block; font-size: 13px; font-weight: 650; color: var(--muted); margin: 10px 0 4px; }
    input, textarea { width: 100%; font: inherit; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 11px; background: #fff; color: var(--ink); }
    textarea { min-height: 90px; resize: vertical; }
    .send { display: block; width: 100%; margin: 16px 0 0; padding: 14px; border: 0; border-radius: 13px; background: var(--maroon); color: #fff; font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; }
    .send:disabled { opacity: .6; }
    .err { color: var(--red); font-weight: 650; margin: 10px 2px 0; min-height: 1em; }
    .hint { font-size: 12.5px; color: var(--muted); margin: 6px 2px 0; }
    .contact { text-align: center; color: var(--muted); font-size: 13.5px; margin-top: 18px; }
    .contact a { color: var(--maroon); font-weight: 700; text-decoration: none; }
    .msg { text-align: center; padding: 40px 10px; color: var(--muted); }
    .msg .big { font-size: 40px; }
    .msg b { color: var(--ink); font-size: 18px; display: block; margin-bottom: 4px; }
    .again { margin-top: 16px; padding: 11px 18px; border-radius: 12px; border: 1.5px solid var(--maroon); background: #fff; color: var(--maroon); font: inherit; font-weight: 750; cursor: pointer; }
  </style>
</head>
<body>
  <header><div class="biz" id="biz">&nbsp;</div><h1 id="title">Send us your design</h1><div class="shop" id="shop"></div></header>
  <main id="main"><div class="msg">Loading…</div></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
  /* "Send us your design" (no login): a shop sends photos of a design it wants
     made. From the shop's own page (we know the shop) or from the link for any
     shop (it writes its name and mobile). The photos go to the link's folder. */
  (function () {
    'use strict';
    var T = {
      hi: {
        'Send us your design': 'हमें अपना डिज़ाइन भेजें', 'For': 'के लिए',
        'Send photos of a design you want made — from a catalogue, Instagram, or your own drawing. We will call you back with the details.':
          'जो डिज़ाइन बनवाना है उसकी फोटो भेजें — कैटलॉग, Instagram या आपकी अपनी ड्रॉइंग। हम आपको पूरी जानकारी के साथ कॉल करेंगे।',
        'Photos of the design': 'डिज़ाइन की फोटो', 'Add photos': 'फोटो जोड़ें', 'Up to 6 photos': '6 फोटो तक',
        'Your shop': 'आपकी दुकान', 'Shop name': 'दुकान का नाम', 'Mobile': 'मोबाइल', 'City': 'शहर',
        'What should we make?': 'क्या बनाना है?', 'Metal, purity, size, weight, by when…': 'मेटल, शुद्धता, साइज़, वज़न, कब तक…',
        'Send the design': 'डिज़ाइन भेजें', 'Sending…': 'भेज रहे हैं…', 'Add at least one photo of the design': 'डिज़ाइन की कम से कम एक फोटो जोड़ें',
        'Write the name of your shop': 'अपनी दुकान का नाम लिखें', 'Write your mobile number': 'अपना मोबाइल नंबर लिखें',
        'A photo could not be sent — try again.': 'एक फोटो नहीं भेजी जा सकी — फिर से कोशिश करें।',
        'Too many designs sent today — please send them on WhatsApp': 'आज बहुत सारे डिज़ाइन भेजे गए — कृपया WhatsApp पर भेजें',
        'Thank you — we got your design': 'धन्यवाद — हमें आपका डिज़ाइन मिल गया', 'We will call you soon.': 'हम जल्द ही आपको कॉल करेंगे।',
        'Send another design': 'एक और डिज़ाइन भेजें', 'Questions? Call or WhatsApp': 'कोई सवाल? कॉल या WhatsApp करें',
        'This link is not active any more.': 'यह लिंक अब चालू नहीं है।', 'Please ask us for a new link.': 'कृपया हमसे नया लिंक मांगें।',
        'This link does not work any more': 'यह लिंक अब काम नहीं करता',
        'Could not load — check the internet and open the link again.': 'लोड नहीं हुआ — इंटरनेट देखें और लिंक फिर से खोलें।',
        'Could not send — check the internet and try again.': 'भेजा नहीं जा सका — इंटरनेट देखें और फिर से कोशिश करें।',
        'Remove': 'हटाएँ', 'Loading…': 'लोड हो रहा है…',
        'A photo could not be opened — choose another one.': 'एक फोटो खुल नहीं सकी — कोई दूसरी फोटो चुनें।'
      },
      gu: {
        'Send us your design': 'અમને તમારી ડિઝાઇન મોકલો', 'For': 'માટે',
        'Send photos of a design you want made — from a catalogue, Instagram, or your own drawing. We will call you back with the details.':
          'જે ડિઝાઇન બનાવડાવવી છે તેના ફોટા મોકલો — કેટલોગ, Instagram કે તમારું પોતાનું ડ્રોઇંગ. અમે તમને પૂરી વિગત સાથે કૉલ કરીશું.',
        'Photos of the design': 'ડિઝાઇનના ફોટા', 'Add photos': 'ફોટા ઉમેરો', 'Up to 6 photos': '6 ફોટા સુધી',
        'Your shop': 'તમારી દુકાન', 'Shop name': 'દુકાનનું નામ', 'Mobile': 'મોબાઇલ', 'City': 'શહેર',
        'What should we make?': 'શું બનાવવાનું છે?', 'Metal, purity, size, weight, by when…': 'ધાતુ, શુદ્ધતા, સાઇઝ, વજન, ક્યાં સુધી…',
        'Send the design': 'ડિઝાઇન મોકલો', 'Sending…': 'મોકલી રહ્યા છીએ…', 'Add at least one photo of the design': 'ડિઝાઇનનો ઓછામાં ઓછો એક ફોટો ઉમેરો',
        'Write the name of your shop': 'તમારી દુકાનનું નામ લખો', 'Write your mobile number': 'તમારો મોબાઇલ નંબર લખો',
        'A photo could not be sent — try again.': 'એક ફોટો મોકલી ન શકાયો — ફરી પ્રયત્ન કરો.',
        'Too many designs sent today — please send them on WhatsApp': 'આજે ઘણી ડિઝાઇન મોકલાઈ — કૃપા કરીને WhatsApp પર મોકલો',
        'Thank you — we got your design': 'આભાર — અમને તમારી ડિઝાઇન મળી ગઈ', 'We will call you soon.': 'અમે જલ્દી તમને કૉલ કરીશું.',
        'Send another design': 'બીજી ડિઝાઇન મોકલો', 'Questions? Call or WhatsApp': 'કોઈ પ્રશ્ન? કૉલ અથવા WhatsApp કરો',
        'This link is not active any more.': 'આ લિંક હવે ચાલુ નથી.', 'Please ask us for a new link.': 'કૃપા કરીને અમારી પાસે નવી લિંક માંગો.',
        'This link does not work any more': 'આ લિંક હવે કામ કરતી નથી',
        'Could not load — check the internet and open the link again.': 'લોડ ન થયું — ઇન્ટરનેટ તપાસો અને લિંક ફરી ખોલો.',
        'Could not send — check the internet and try again.': 'મોકલી ન શકાયું — ઇન્ટરનેટ તપાસો અને ફરી પ્રયત્ન કરો.',
        'Remove': 'દૂર કરો', 'Loading…': 'લોડ થાય છે…',
        'A photo could not be opened — choose another one.': 'એક ફોટો ખૂલી ન શક્યો — બીજો ફોટો પસંદ કરો.'
      }
    };
    var MAX = 6;
    var lang = 'en';
    var stored = null;
    try { stored = localStorage.getItem('statusLang') || localStorage.getItem('lang'); } catch (e) { /* private mode */ }
    if (stored === 'hi' || stored === 'gu' || stored === 'en') lang = stored;
    else { var nl = String(navigator.language || '').slice(0, 2); if (nl === 'hi' || nl === 'gu') lang = nl; }
    function t(s) { return (T[lang] && T[lang][s]) || s; }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function keep(k, v) { try { if (v == null) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { /* private mode */ } return ''; }

    var c = window.APP_CONFIG || {};
    var token = (location.hash || '').replace(/^#/, '').trim().toLowerCase();
    var main = document.getElementById('main');
    var data = null, pics = [], form = { name: keep('dsName'), phone: keep('dsPhone'), city: keep('dsCity'), note: '' }, busy = false;
    if (c.BUSINESS_NAME) document.getElementById('biz').textContent = c.BUSINESS_NAME;
    function message(big, lines, extra) {
      main.innerHTML = '<div class="msg"><div class="big">' + big + '</div>' + lines.map(function (x, i) { return i === 0 && extra ? '<b>' + esc(t(x)) + '</b>' : '<p>' + esc(t(x)) + '</p>'; }).join('') + (extra || '') + '</div>';
    }
    if (!window.supabase || !c.SUPABASE_URL || !/^[0-9a-f-]{36}$/.test(token)) { message('🔗', ['This link is not active any more.', 'Please ask us for a new link.']); return; }
    var db = window.supabase.createClient(c.SUPABASE_URL, c.SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });

    function langBar() {
      return '<div class="langs">' + [['en', 'English'], ['hi', 'हिन्दी'], ['gu', 'ગુજરાતી']].map(function (x) {
        return '<button data-l="' + x[0] + '" class="' + (lang === x[0] ? 'on' : '') + '">' + x[1] + '</button>';
      }).join('') + '</div>';
    }
    function contact() {
      var b = (data && data.business) || {};
      if (!b.phone) return '';
      var ph = String(b.phone).replace(/[^\d+]/g, '');
      var wa = ph.replace(/\D/g, ''); if (wa.length === 10) wa = '91' + wa;
      return '<p class="contact">' + esc(t('Questions? Call or WhatsApp')) + '<br><a href="tel:' + esc(ph) + '">' + esc(b.phone) + '</a> · <a href="https://wa.me/' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a></p>';
    }
    function readForm() {
      ['name', 'phone', 'city', 'note'].forEach(function (k) { var el = document.getElementById('f-' + k); if (el) form[k] = el.value; });
    }
    function draw(err) {
      var b = data.business || {};
      document.getElementById('biz').textContent = b.name || c.BUSINESS_NAME || '';
      document.getElementById('title').textContent = t('Send us your design');
      document.getElementById('shop').textContent = data.shop ? t('For') + ' ' + data.shop : (b.city || '');
      document.title = t('Send us your design') + ' — ' + (b.name || '');
      var h = langBar() + '<p class="lead">' + esc(t('Send photos of a design you want made — from a catalogue, Instagram, or your own drawing. We will call you back with the details.')) + '</p>' +
        '<h2>' + esc(t('Photos of the design')) + '</h2><div class="card"><div class="pics">' +
        pics.map(function (p, i) { return '<div class="pic"><img src="' + p.url + '" alt=""><button type="button" data-rm="' + i + '" aria-label="' + esc(t('Remove')) + '">✕</button></div>'; }).join('') +
        (pics.length < MAX ? '<button type="button" class="add" id="add"><b>＋</b><span>' + esc(t('Add photos')) + '</span></button>' : '') +
        '</div><div class="hint">' + esc(t('Up to 6 photos')) + '</div></div>';
      if (data.via === 'link') {
        h += '<h2>' + esc(t('Your shop')) + '</h2><div class="card">' +
          '<label for="f-name">' + esc(t('Shop name')) + '</label><input id="f-name" autocomplete="organization" value="' + esc(form.name) + '">' +
          '<label for="f-phone">' + esc(t('Mobile')) + '</label><input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" value="' + esc(form.phone) + '">' +
          '<label for="f-city">' + esc(t('City')) + '</label><input id="f-city" autocomplete="address-level2" value="' + esc(form.city) + '"></div>';
      }
      h += '<h2>' + esc(t('What should we make?')) + '</h2><div class="card"><textarea id="f-note" maxlength="1000" placeholder="' + esc(t('Metal, purity, size, weight, by when…')) + '">' + esc(form.note) + '</textarea></div>' +
        '<button class="send" id="send"' + (busy ? ' disabled' : '') + '>' + esc(t(busy ? 'Sending…' : 'Send the design')) + '</button>' +
        '<div class="err" id="err">' + esc(err ? t(err) : '') + '</div>' + contact();
      main.innerHTML = h;
      main.querySelectorAll('.langs button').forEach(function (bt) {
        bt.onclick = function () { readForm(); lang = bt.dataset.l; keep('statusLang', lang); draw(); };
      });
      main.querySelectorAll('[data-rm]').forEach(function (bt) { bt.onclick = function () { readForm(); pics.splice(+bt.dataset.rm, 1); draw(); }; });
      var add = document.getElementById('add');
      if (add) add.onclick = function () {
        readForm();
        var inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
        inp.onchange = function () { addFiles(Array.prototype.slice.call(inp.files || [])); };
        inp.click();
      };
      document.getElementById('send').onclick = send;
    }
    /* a photo, made smaller (long side 1600 px) as a JPEG — phones take big pictures */
    function shrink(file) {
      return new Promise(function (ok) {
        var url = URL.createObjectURL(file);
        var im = new Image();
        im.onload = function () {
          var s = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
          var cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(im.naturalWidth * s)); cv.height = Math.max(1, Math.round(im.naturalHeight * s));
          var g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(im, 0, 0, cv.width, cv.height);
          cv.toBlob(function (b) { URL.revokeObjectURL(url); ok(b ? { blob: b, url: URL.createObjectURL(b) } : null); }, 'image/jpeg', 0.85);
        };
        im.onerror = function () { URL.revokeObjectURL(url); ok(null); };
        im.src = url;
      });
    }
    function addFiles(files) {
      var room = MAX - pics.length;
      Promise.all(files.slice(0, room).map(shrink)).then(function (list) {
        list.forEach(function (p) { if (p) pics.push(p); });
        draw(list.some(function (p) { return !p; }) ? 'A photo could not be opened — choose another one.' : '');
      });
    }
    function rid() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
    function send() {
      if (busy) return;
      readForm();
      if (!pics.length) { draw('Add at least one photo of the design'); return; }
      if (data.via === 'link') {
        if (String(form.name).trim().length < 2) { draw('Write the name of your shop'); return; }
        if (String(form.phone).replace(/\D/g, '').length < 10) { draw('Write your mobile number'); return; }
        keep('dsName', String(form.name).trim()); keep('dsPhone', String(form.phone).trim()); keep('dsCity', String(form.city).trim());
      }
      busy = true; draw();
      var paths = [];
      var up = pics.reduce(function (p, x) {
        return p.then(function () {
          if (x.path) { paths.push(x.path); return; }
          var path = token + '/' + rid() + '.jpg';
          return db.storage.from('inbox').upload(path, x.blob, { contentType: 'image/jpeg' }).then(function (r) {
            if (r.error) throw new Error('upload');
            x.path = path; paths.push(path);
          });
        });
      }, Promise.resolve());
      up.then(function () {
        return db.rpc('design_send', { p_token: token, p_paths: paths, p_name: form.name || null, p_phone: form.phone || null, p_city: form.city || null, p_note: form.note || null });
      }).then(function (r) {
        busy = false;
        if (r.error) { draw(String(r.error.message || '').replace(/\.$/, '') || 'Could not send — check the internet and try again.'); return; }
        pics = []; form.note = '';
        message('✅', ['Thank you — we got your design', 'We will call you soon.'], '<button class="again" id="again">' + esc(t('Send another design')) + '</button>' + contact());
        document.getElementById('again').onclick = function () { draw(); };
      }, function (e) {
        busy = false;
        draw(e && e.message === 'upload' ? 'A photo could not be sent — try again.' : 'Could not send — check the internet and try again.');
      });
    }

    db.rpc('design_page', { p_token: token }).then(function (r) {
      if (r.error) { message('⚠️', [/function|schema cache/i.test(String(r.error.message || '')) ? 'This link is not active any more.' : 'Could not load — check the internet and open the link again.']); return; }
      if (!r.data) { message('🔗', ['This link is not active any more.', 'Please ask us for a new link.']); return; }
      data = r.data;
      draw();
    }, function () { message('⚠️', ['Could not load — check the internet and open the link again.']); });
  })();
  </script>
</body>
</html>
