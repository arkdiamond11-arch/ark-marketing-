<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b1e3c">
  <meta name="robots" content="noindex">
  <title>Your orders</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    :root { --maroon: #7b1e3c; --gold: #c9973c; --bg: #f6f4f1; --card: #fff; --ink: #27222b; --muted: #857e8c; --line: #eae6e2; --green: #1a7f4e; --red: #b3372f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", "Noto Sans Gujarati", sans-serif; font-size: 15px; line-height: 1.45; }
    header { background: var(--maroon); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 14px; }
    header .biz { font-size: 13px; letter-spacing: .6px; text-transform: uppercase; opacity: .85; }
    header h1 { margin: 2px 0 0; font-size: 21px; }
    header .shop { font-size: 14px; opacity: .9; }
    main { max-width: 560px; margin: 0 auto; padding: 14px 16px 30px; }
    .langs { display: flex; gap: 6px; justify-content: flex-end; margin: 0 0 10px; }
    .langs button { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
    .langs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .card { background: var(--card); border-radius: 14px; box-shadow: 0 1px 3px rgba(40,20,30,.08), 0 4px 14px rgba(40,20,30,.05); padding: 13px 14px; margin: 0 0 12px; }
    h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin: 18px 2px 8px; }
    .pay { background: #fbf3e4; border: 1.5px solid #ecd9b4; font-weight: 700; }
    .ord { display: flex; gap: 12px; }
    .ord .pic { width: 64px; height: 64px; border-radius: 10px; background: #f3efe9; flex: none; object-fit: cover; cursor: zoom-in; }
    .ord .body { flex: 1; min-width: 0; }
    .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .top b { font-size: 15.5px; }
    .step { color: var(--maroon); font-weight: 800; }
    .step.done { color: var(--green); }
    .its { font-size: 13.5px; color: var(--muted); margin: 2px 0; overflow-wrap: anywhere; }
    .due { font-size: 13.5px; font-weight: 650; }
    .due.late { color: var(--red); }
    .bar { display: flex; gap: 3px; margin: 8px 0 2px; }
    .bar i { flex: 1; height: 6px; border-radius: 3px; background: #e8e1db; }
    .bar i.done { background: var(--green); }
    .bar i.cur { background: var(--gold); }
    .cad { display: block; margin: 10px 0 0; padding: 11px 13px; border-radius: 12px; background: var(--maroon); color: #fff; text-decoration: none; font-weight: 750; }
    .cad span { display: block; font-weight: 500; font-size: 13px; opacity: .9; }
    .row { padding: 8px 0; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; padding-top: 0; }
    .row:last-child { padding-bottom: 0; }
    .row b { display: block; }
    .row span { font-size: 13.5px; color: var(--muted); }
    .ok { color: var(--green); font-weight: 750; }
    .contact { text-align: center; color: var(--muted); font-size: 13.5px; margin-top: 18px; }
    .contact a { color: var(--maroon); font-weight: 700; text-decoration: none; }
    .msg { text-align: center; padding: 40px 10px; color: var(--muted); }
    .msg .big { font-size: 40px; }
    .zoom { position: fixed; inset: 0; background: rgba(10, 8, 12, .92); display: flex; align-items: center; justify-content: center; z-index: 9; }
    .zoom img { max-width: 100%; max-height: 100%; }
    .design { display: block; margin: 6px 0 12px; padding: 12px 14px; border-radius: 14px; background: #fff; border: 1.5px dashed var(--gold); color: var(--maroon); text-decoration: none; font-weight: 750; }
    .design span { display: block; font-weight: 500; font-size: 13px; color: var(--muted); }
    .extra { display: flex; gap: 12px; align-items: center; }
    .extra .ic { font-size: 26px; flex: none; }
    .extra b { display: block; }
    .extra span { color: var(--muted); font-size: 13px; }
    .extra .go { margin-left: auto; flex: none; padding: 9px 14px; border: 0; border-radius: 11px; background: var(--maroon); color: #fff; font: inherit; font-weight: 750; cursor: pointer; }
    .tr-btn { margin-top: 8px; border: 1.5px solid var(--line); background: #fff; color: var(--maroon); border-radius: 10px; padding: 6px 11px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    .sheet { position: fixed; inset: 0; background: rgba(20, 15, 20, .5); display: flex; align-items: flex-end; justify-content: center; z-index: 8; }
    .sheet .in { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); }
    .sheet h3 { margin: 0 0 6px; }
    .sheet label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    .sheet input { width: 100%; font: inherit; padding: 10px 11px; border: 1.5px solid var(--line); border-radius: 11px; }
    .sheet .row { display: flex; gap: 8px; margin-top: 14px; }
    .sheet .row button { flex: 1; padding: 12px 14px; border-radius: 12px; font: inherit; font-weight: 750; cursor: pointer; border: 1.5px solid var(--line); background: #fff; }
    .sheet .row .pri { background: var(--maroon); color: #fff; border-color: var(--maroon); }
    .sheet .lnk { background: #f6f3ef; border-radius: 10px; padding: 9px 11px; font-size: 13px; overflow-wrap: anywhere; margin-top: 8px; }
    .sheet canvas { width: 100%; border-radius: 12px; display: block; margin-top: 10px; }
    .sheet .rates { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
    .sheet .err { color: var(--red); font-weight: 650; font-size: 13.5px; margin: 8px 0 0; }
  </style>
</head>

      var its = itemsLine(o.items);
      if (its) h += '<div class="its">' + esc(its) + '</div>';
      if (st === 'delivered') h += '<div class="due">' + esc(t('Delivered on') + ' ' + day(o.delivered_on)) + '</div>';
      else if (st !== 'quote') {
        var late = o.due_date && new Date(o.due_date + 'T00:00:00') < today;
        if (late) h += '<div class="due late">' + esc(t('Running late — new date soon')) + '</div>';
        else if (o.due_date) h += '<div class="due">' + esc(t('Delivery by') + ' ' + day(o.due_date)) + '</div>';
        var used = steps.slice();
        if (st !== 'new' && used.indexOf(st) === -1) used.push(st);
        used.sort(function (a, z) { return ALL.indexOf(a) - ALL.indexOf(z); });
        var list = ['new'].concat(used).concat(['delivered']);
        var cur = list.indexOf(st);
        h += '<div class="bar">' + list.map(function (k, i) { return '<i class="' + (i < cur ? 'done' : i === cur ? 'cur' : '') + '"></i>'; }).join('') + '</div>';
      }
      if (o.cad) h += '<a class="cad" href="cad.html#' + esc(o.cad) + '">✎ ' + esc(t('CAD design waiting for your OK')) + '<span>' + esc(t('See the CAD and approve')) + ' ›</span></a>';
      if ('track' in o && st !== 'quote') h += '<button class="tr-btn" data-tr="' + esc(o.order_no) + '">🔗 ' + esc(t(o.track ? "Your customer's link" : 'Link for your customer')) + '</button>';   // update 23
      return h + '</div></div>';
    }

    function draw() {
      var d = data, b = d.business || {};
      document.getElementById('biz').textContent = b.name || c.BUSINESS_NAME || '';
      document.getElementById('title').textContent = d.shop || t('Your orders with us');
      document.getElementById('shop').textContent = t('Your orders with us') + (d.city ? ' · ' + d.city : '');
      document.title = (d.shop || '') + ' — ' + (b.name || '');
      var steps = Array.isArray(b.steps) ? ALL.filter(function (k) { return b.steps.indexOf(k) > -1; }) : ALL.slice();
      var open = (d.orders || []).filter(function (o) { return o.status !== 'delivered'; });
      var done = (d.orders || []).filter(function (o) { return o.status === 'delivered'; });
      var h = langBar();
      if (d.payment && d.payment.due_by) h += '<div class="card pay">💳 ' + esc(t('Payment due by') + ' ' + day(d.payment.due_by)) + '</div>';
      if (d.rate && window.ArkPoster) h += '<div class="card extra"><span class="ic">📈</span><div><b>' + esc(t("Today's rate card for your shop")) + '</b><span>' + esc(t("With your shop's name — for your WhatsApp status")) + '</span></div><button class="go" data-po="1">' + esc(t('Make it')) + '</button></div>';
      if (d.showroom) h += '<div class="card extra"><span class="ic">🛍</span><div><b>' + esc(t('Your showroom for your customers')) + '</b><span>' + esc(t("Our designs under your shop's name — share it with your customers")) + '</span></div><button class="go" data-sr="' + esc(d.showroom) + '">' + esc(t('Share')) + '</button></div>';
      if (open.length) h += '<h2>' + esc(t('Orders in work')) + '</h2>' + open.map(function (o) { return orderCard(o, steps); }).join('');
      if ((d.memos || []).length) {
        var today = new Date(); today.setHours(0, 0, 0, 0);
        h += '<h2>' + esc(t('Pieces with you on approval')) + '</h2>' + d.memos.map(function (m) {
          var late = m.return_by && new Date(m.return_by + 'T00:00:00') < today;
          return '<div class="card"><div class="top"><b>' + esc(no('APP', m.memo_no)) + '</b><span class="due' + (late ? ' late' : '') + '">' +
            esc([m.given_on ? t('Given on') + ' ' + day(m.given_on) : '', m.return_by ? t('Return by') + ' ' + day(m.return_by) : ''].filter(Boolean).join(' · ')) + '</span></div>' +
            (m.items || []).map(function (it) {
              return '<div class="row"><span>' + esc([it.description, it.design_code].filter(Boolean).join(' · ') + (it.qty > 1 ? ' × ' + it.qty : '') + (it.net_wt ? ' · ' + it.net_wt + ' g' : '')) + '</span></div>';
            }).join('') + '</div>';
        }).join('');
      }
      if ((d.repairs || []).length) {
        h += '<h2>' + esc(t('Repairs')) + '</h2><div class="card">' + d.repairs.map(function (r) {
          return '<div class="row"><div class="top"><b>' + esc(no('REP', r.repair_no) + (r.piece ? ' · ' + r.piece : '')) + '</b>' +
            '<span class="' + (r.status === 'ready' ? 'ok' : 'step') + '">' + esc(t(REPAIR[r.status] || r.status)) + '</span></div>' +
            (r.status !== 'ready' && r.due_date ? '<span>' + esc(t('Ready by') + ' ' + day(r.due_date)) + '</span>' : '') + '</div>';
        }).join('') + '</div>';
      }
      if (done.length) h += '<h2>' + esc(t('Delivered in the last 60 days')) + '</h2>' + done.map(function (o) { return orderCard(o, steps); }).join('');
      if (designOk) h += '<a class="design" href="design.html#' + esc(token) + '">📷 ' + esc(t('Send us a design you want made')) + '<span>' + esc(t('Photos from a catalogue, Instagram or your own drawing')) + ' ›</span></a>';
      if (!open.length && !done.length && !(d.memos || []).length && !(d.repairs || []).length && !(d.payment && d.payment.due_by)) {
        h += '<div class="msg"><div class="big">🌤️</div><p>' + esc(t('Nothing running right now.')) + '</p></div>';
      }
      if (window.ShopMore) h += ShopMore.html(d, lang);   // update 24: level, rate alerts, pieces bought, exchange, refer a shop
      if (b.phone) {
        var ph = String(b.phone).replace(/[^\d+]/g, '');
        var wa = ph.replace(/\D/g, ''); if (wa.length === 10) wa = '91' + wa;
        h += '<p class="contact">' + esc(t('Questions? Call or WhatsApp')) + '<br><a href="tel:' + esc(ph) + '">' + esc(b.phone) + '</a> · <a href="https://wa.me/' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a></p>';
      }
      main.innerHTML = h;
      main.querySelectorAll('.langs button').forEach(function (bt) {
        bt.onclick = function () { lang = bt.dataset.l; try { localStorage.setItem('statusLang', lang); } catch (e) { /* ignore */ } draw(); };
      });
      main.querySelectorAll('[data-tr]').forEach(function (bt) { bt.onclick = function () { trackFor(bt.dataset.tr); }; });
      if (window.ShopMore) ShopMore.wire(main, { db: db, token: token, data: data, lang: lang, redraw: draw });
      main.querySelectorAll('[data-sr]').forEach(function (bt) { bt.onclick = function () { shareOut(t('See our new designs') + ' — ' + (data.shop || ''), new URL('showroom.html#' + bt.dataset.sr, location.href).href); }; });
      main.querySelectorAll('[data-po]').forEach(function (bt) { bt.onclick = posterSheet; });
      main.querySelectorAll('img.pic').forEach(function (im) {
        im.onclick = function () {
          if (!im.src) return;
          var z = document.createElement('div'); z.className = 'zoom';
          z.innerHTML = '<img alt="">'; z.firstChild.src = im.src;
          z.onclick = function () { z.remove(); };
          document.body.appendChild(z);
        };
      });
    }

    /* update 23: a link for the shop's own customer, its showroom, its rate card */
    function shareOut(text, url) {
      var all = text + '\n' + url;
      if (navigator.share) { navigator.share({ text: all }).then(function () {}, function () {}); return; }
      window.open('https://wa.me/?text=' + encodeURIComponent(all), '_blank');
    }
    function sheet(html) {
      var old = document.querySelector('.sheet'); if (old) old.remove();
      var s = document.createElement('div'); s.className = 'sheet';
      s.innerHTML = '<div class="in">' + html + '</div>';
      s.onclick = function (e) { if (e.target === s) s.remove(); };
      document.body.appendChild(s);
      return s;
    }
    function trackFor(ono) {
      var o = (data.orders || []).filter(function (x) { return String(x.order_no) === String(ono); })[0];
      if (!o) return;
      var url = o.track ? new URL('track.html#' + o.track, location.href).href : '';
      var s = sheet('<h3>🔗 ' + esc(t('Link for your customer')) + '</h3><div style="color:var(--muted);font-size:13.5px">' + esc(no('ORD', o.order_no)) + ' · ' + esc(t("It shows your shop's name and how far the order has come — no prices.")) + '</div>' +
        '<label for="tr-n">' + esc(t("Customer's name (optional)")) + '</label><input id="tr-n" maxlength="80" value="' + esc(o.track_name || '') + '">' +
        (url ? '<div class="lnk">' + esc(url) + '</div>' : '') + '<p class="err" id="tr-err"></p>' +
        '<div class="row"><button id="tr-x">' + esc(t('Close')) + '</button><button class="pri" id="tr-go">' + esc(t(url ? 'Share' : 'Make the link')) + '</button></div>');
      s.querySelector('#tr-x').onclick = function () { s.remove(); };
      s.querySelector('#tr-go').onclick = function () {
        var nm = s.querySelector('#tr-n').value.trim(), go = s.querySelector('#tr-go');
        go.disabled = true;
        db.rpc('shop_track_link', { p_token: token, p_order_no: o.order_no, p_name: nm || null }).then(function (r) {
          go.disabled = false;
          if (r.error || !r.data) { s.querySelector('#tr-err').textContent = r.error ? t(String(r.error.message || '').replace(/\.$/, '')) : ''; return; }
          o.track = r.data; o.track_name = nm || o.track_name;
          var u = new URL('track.html#' + r.data, location.href).href;
          s.remove(); draw();
          shareOut((nm ? nm + ' — ' : '') + t('Your order') + ' · ' + (data.shop || ''), u);
        }, function () { go.disabled = false; s.querySelector('#tr-err').textContent = t('Could not load — check the internet and open the link again.'); });
      };
    }
    function posterSheet() {
      if (!window.ArkPoster || !data.rate) return;
      var rows = ArkPoster.rateRows(data.rate, lang);
      var P = { shop: data.shop || '', city: data.city || '', phone: data.phone || '', lang: lang, theme: 'maroon', date: data.rate.on, rows: rows };
      var s = sheet('<h3>📈 ' + esc(t('Rate card')) + '</h3><div style="color:var(--muted);font-size:13.5px">' + esc(t('Rates for 10 g (silver: 1 kg)')) + '</div>' +
        '<div class="rates">' + rows.map(function (r, i) { return '<div><label for="po-' + i + '">' + esc(r.k) + '</label><input id="po-' + i + '" inputmode="numeric" value="' + r.v + '"></div>'; }).join('') + '</div>' +
        '<label for="po-ph">' + esc(t('Your phone on it')) + '</label><input id="po-ph" inputmode="tel" value="' + esc(P.phone) + '">' +
        '<div id="po-c"></div><div class="row"><button id="po-x">' + esc(t('Close')) + '</button><button class="pri" id="po-go">' + esc(t('Share / Save')) + '</button></div>');
      function redraw() {
        P.rows = rows.map(function (r, i) { var v = Math.round(Number(String(s.querySelector('#po-' + i).value).replace(/[^\d.]/g, '')) || 0); return { k: r.k, per: r.per, v: v }; });
        P.phone = s.querySelector('#po-ph').value.trim();
        var cv = ArkPoster.rateCard(P), box = s.querySelector('#po-c');
        box.innerHTML = ''; box.appendChild(cv);
        return cv;
      }
      s.querySelectorAll('input').forEach(function (i) { i.oninput = redraw; });
      redraw();
      s.querySelector('#po-x').onclick = function () { s.remove(); };
      s.querySelector('#po-go').onclick = function () { ArkPoster.share(redraw(), 'rate-card', ''); };
    }

    db.rpc('shop_page', { p_token: token }).then(function (r) {
      if (r.error) { message('⚠️', ['Could not load — check the internet and open the link again.']); return; }
      if (!r.data) { message('🔗', ['This link is not active any more.', 'Please ask us for a new link.']); return; }
      data = r.data;
      draw();
      if (!teamPhone()) { try { db.rpc('link_seen', { p_kind: 'shop', p_token: token }).then(function () {}, function () {}); } catch (e) { /* not counted */ } }
      var paths = [], cat = [];
      (data.orders || []).forEach(function (o) {
        var k = picKey(o);
        if (k.indexOf('o:') === 0) paths.push(k.slice(2)); else if (k.indexOf('c:') === 0) cat.push(k.slice(2));
      });
      function sign(bucket, list, pre) {
        if (!list.length) return Promise.resolve();
        return db.storage.from(bucket).createSignedUrls(list, 3600).then(function (s) {
          (s.data || []).forEach(function (x) { if (x && x.signedUrl) urls[pre + x.path] = x.signedUrl; });
        }, function () { /* the photos stay blank */ });
      }
      if (paths.length || cat.length) Promise.all([sign('orders', paths, 'o:'), sign('catalogue', cat, 'c:')]).then(draw);
      // database update 16: the shop can send a design it wants made, from here
      db.rpc('design_page', { p_token: token }).then(function (r2) { if (!r2.error && r2.data) { designOk = true; draw(); } }, function () { /* not offered */ });
    }, function () { message('⚠️', ['Could not load — check the internet and open the link again.']); });
  })();
  </script>
</body>
</html>
